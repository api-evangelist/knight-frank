openapi: 3.2.0
info:
  title: KnightFrank Api v3 Office API
  description: KnightFrank Api v3
  version: v1
tags:
- name: Office
paths:
  /office:
    get:
      tags:
      - Office
      parameters:
      - name: term
        in: query
        schema:
          type: string
      - name: isoCode
        in: query
        schema:
          type: string
      - name: languageCode
        in: query
        schema:
          type: string
      - name: maxResultCount
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      summary: Get office
      x-summary-source: derived
      operationId: getOffice
      x-operation-id-source: derived
  /office/{id}:
    get:
      tags:
      - Office
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      summary: Get office by id
      x-summary-source: derived
      operationId: getOfficeById
      x-operation-id-source: derived
