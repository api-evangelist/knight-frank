apis:
- aid: knight-frank:knight-frank-api-v3
  name: KnightFrank Api v3
  description: >-
    The corporate search service behind knightfrank.com and knightfrank.co.uk, titled
    "KnightFrank Api v3" by its own OpenAPI document. It exposes 11 operations across
    seven tags — CMSPage, IntelligenceLab, Office, Person, Search, ServiceLine and
    Telemetry — covering CMS content search, the Knight Frank Intelligence Lab research
    index, the global office directory, the people/partner directory with autocomplete,
    a general cross-site search, service-line lookup and a selection-count telemetry
    write. It is NOT a published developer product: Knight Frank advertises it nowhere,
    documents it nowhere, and offers no terms, keys or signup for it. It is recorded here
    because it is a genuine, verifiable machine-readable contract that is reachable
    anonymously. Probed on 2026-07-26, the Swagger UI at /swagger/index.html returned
    HTTP 200, /swagger/v1/swagger.json returned HTTP 200 with a valid OpenAPI 3.0.1
    document, and GET /office and GET /person returned HTTP 200 with real office and
    staff records to a client presenting no credential of any kind. There is no
    securitySchemes block in the document and no authentication is enforced.
  humanURL: https://api-v3.web.prd-knightfrank.com/swagger/index.html
  baseURL: https://api-v3.web.prd-knightfrank.com
