caveats:
- The upstream API enforces no authentication and no rate limiting, so any MCP server built over it would
  be an unmetered anonymous proxy in front of a live production search index.
- The people directory returns named individuals' direct-dial and mobile numbers and corporate email addresses.
  Exposing it as an agent tool is a data protection decision (UK GDPR), not merely a technical one.
- incrementSelectedCount is a non-idempotent unauthenticated write and should be excluded from, or gated
  in, any agent tool surface.
