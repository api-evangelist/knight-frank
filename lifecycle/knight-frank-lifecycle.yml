description: >-
  Knight Frank operates its APIs as internal plumbing, so there is no lifecycle
  contract of any kind for an outside consumer: no versioning policy, no
  deprecation policy, no Sunset/Deprecation headers, no SLA, no status page and
  no changelog. The only version signal in the estate is the hostname — api-v2
  and api-v3 run side by side, the older one carrying the property/account
  surface and the newer one the corporate search surface.
