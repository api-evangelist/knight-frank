description: >-
  Knight Frank's APIs have no error contract. The published OpenAPI document
  declares no 4xx or 5xx response on any operation and defines no error schema,
  so every failure below was established by probing. Failures come back as bare
  status codes with empty bodies, an unstructured 500, or the framework default
  from ASP.NET Web API — never as a typed, documented problem object. An agent
  or integrator cannot distinguish "no results", "bad parameter" and "wrong
  parameter name" from the response shape alone.
