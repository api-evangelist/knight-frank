liveEndpointVerification:
  note: >-
    Anonymous GETs issued on 2026-07-26 with a browser user-agent and no credential of
    any kind, to establish whether the api-v3 contract describes a reachable API or a
    dead one. It is reachable and it returns real records.
  calls:
  - request: GET https://api-v3.web.prd-knightfrank.com/office?term=london&isoCode=GB&languageCode=en&maxResultCount=2
    status: 200
    contentType: application/json; charset=utf-8
    bytes: 1511
    result: >-
      Array of real office records — officeId, name, address lines, postcode, country,
      countryCode, phoneNumber, emailAddress, url, officeOpeningTimes.
  - request: GET https://api-v3.web.prd-knightfrank.com/person?term=smith&isoCode=GB&languageCode=en&maxResultCount=2
    status: 200
    contentType: application/json; charset=utf-8
    bytes: 1227
    result: >-
      Array of real staff records — firstName, surname, title, empNo, eaaLicense, url
      slug, email, imageUrl on content.knightfrank.com, directDial, mobile,
      displayName, countryCode, department.
  - request: GET https://api-v3.web.prd-knightfrank.com/service-lines?term=valuation&isoCode=GB&domain=www.knightfrank.co.uk
    status: 200
    bytes: 69
    result: '{"results":[],"hasMore":false,"totalCount":0,"fromFuzzySearch":false}'
  - request: GET https://api-v3.web.prd-knightfrank.com/intelligencelab?term=prime&languageCode=en&hostname=www.knightfrank.com&skip=0
    status: 200
    bytes: 69
    result: '{"results":[],"hasMore":false,"totalCount":0,"fromFuzzySearch":false}'
  - request: GET https://api-v3.web.prd-knightfrank.com/search?searchTerm=london
    status: 204
    result: No content — the documented parameter is `term`, not `searchTerm`.
  - request: GET https://api-v3.web.prd-knightfrank.com/intelligencelab/facets
    status: 500
    result: Server error when required parameters are omitted. Not an auth challenge.
  - request: GET https://api-v2.web.prd-knightfrank.com/properties/search
    status: 401
    result: Unauthorized, zero-byte body. Bearer token required.
  - request: GET https://api-v2.web.prd-knightfrank.com/secure/account
    status: 401
    result: Unauthorized, zero-byte body. Bearer token required.

frontEndConfiguration:
  note: >-
    Recorded as evidence of how the private estate is wired. Values below are
    client-side public configuration read from page source; no secret material is
    reproduced here.
  source:
    url: https://www.knightfrank.co.uk/properties/residential/for-sale/london
    status: 200
    contentType: text/html; charset=utf-8
    bytes: 59171
    object: kfsearchconfig (inline <script>)
  endpoints:
    ApiBase: https://api-v2.web.prd-knightfrank.com
    ApiSecureBase: https://api-v2.web.prd-knightfrank.com/secure
    ApiBase3: https://api-v3.web.prd-knightfrank.com
    CmsBase: https://www.knightfrank.com
    ResourceHost: https://content.knightfrank.com
    BasePath: /properties/
  appBundle:
    url: https://www.knightfrank.co.uk/properties-resources/js/app-72bd2f22.bundle.js
    status: 200
    bytes: 1057443
    framework: Angular with MSAL (Microsoft Authentication Library), redirect
      interaction type
    protectedResourceMap: ApiSecureBase bound to the Azure AD B2C MyKf.ReadWrite scope
    observedSecurePaths:
    - /account
    - /properties/createsaved
    - /properties/savealerts
    - /properties/saved/
    observedOpenPaths:
    - /search?cachetoken=
  cms: >-
    The corporate sites run Optimizely/EPiServer — /Util/EPiServer.Forms/EPiServerForms.min.js
    and /Util/Find/epi-util/find.js are loaded on knightfrank.co.uk, and EPiServer Find
    is the search layer the api-v3 service fronts.
  cdnAndWaf: >-
    www., api. and content.knightfrank.com are CNAMEd to gccdn.net (Gcore). Direct
    requests to https://api.knightfrank.com/ are answered by a WAF ("wswaf") with HTTP
    502/503 and a Ws-Waf-Response header — it is not a developer API host and serves no
    routes.

apiFamily:
  note: |
    Knight Frank publishes no API documentation, so the family below is the business
    segmentation the company itself uses on its own websites, plus the two internal
    service surfaces that were actually observed. Only the api-v3 surface is listed in
    apis.yml, because it is the only one with a real machine-readable contract.
  segmentationUsedByTheSite:
  - Residential — prime and super-prime sales and lettings, new homes, international
    residential, country/rural houses
  - Commercial — offices, industrial and logistics, retail, healthcare, hotels, data
    centres, life sciences, automotive and roadside
  - Occupier services and tenant representation
  - Capital markets and investment sales
  - Valuation and advisory
  - Property asset management and facilities management
  - Rural, agricultural and estate management consultancy
  - Building consultancy and project management
  - Planning and development, including advisory to property developers and
    housebuilders
  - Research — The Wealth Report, PIRI 100, Luxury Investment Index, Wealth Sizing
    Model, market forecasts
  - Knight Frank Finance — mortgage broking (knightfrankfinance.co.uk)
  observedServiceSurfaces:
  - name: KnightFrank Api v3 (corporate search)
    host: https://api-v3.web.prd-knightfrank.com
    documented: true (its own OpenAPI 3.0.1, unadvertised)
    reachableAnonymously: true
    covers: CMS page search, Intelligence Lab research index, office directory, people
      directory + autocomplete, cross-site search, service-line lookup, telemetry write
  - name: Knight Frank property/account API v2
    host: https://api-v2.web.prd-knightfrank.com
    documented: false
    reachableAnonymously: false (HTTP 401)
    covers: property search, saved properties, saved searches, property alerts,
      consumer account
  listingsSearch: >-
    Consumer web at https://www.knightfrank.co.uk/properties/... backed by the
    undocumented, 401-protected api-v2 host. No documented JSON API, no feed, no
    export, no IDX-equivalent.
  propertyRecords: not available publicly
  valuationAVM: >-
    Knight Frank valuation is a human RICS-registered professional advisory service
    delivered as a report. No AVM product and no valuation API is published or
    documented.
  transactions: not available
  documents: >-
    Brochures are served from https://brochure.knightfrank.com/ (HTTP 200) as static
    documents. No documents API.
  tenancy: not available
  payments: not available

webhooksEventsSdksPostman:
  webhooks: None. No webhook, callback or push mechanism is documented or referenced
    anywhere.
  events: No event bus, no streaming, no AsyncAPI document and no WebSocket surface.
    The only event-shaped thing found is the fire-and-forget POST
    /telemetry/increment-selected-count on api-v3, which is a client analytics write.
  sdks: >-
    None. No Knight Frank SDK exists in any package registry. There is no Knight Frank
    GitHub organization — https://github.com/knightfrank returns HTTP 404, and
    https://github.com/knight-frank returns HTTP 200 but the GitHub API
    (https://api.github.com/users/knight-frank) shows it is type "User", name null,
    created 2018-07-01, with 0 public repositories — an unrelated empty personal
    handle, not the firm.
  postman: No official Postman collection or workspace found.
  changelog: None — there is no developer portal to publish one on.
  statusPage: None. status.knightfrank.com does not resolve.
  rateLimits: Not documented. No rate-limit headers were observed on api-v3 responses.
  sandbox: None.
  llmsTxt: >-
    Neither https://www.knightfrank.com/llms.txt nor https://www.knightfrank.co.uk/llms.txt
    exists (both 404), and https://www.knightfrank.com/.well-known/ai-plugin.json is
    404. robots.txt on both domains blanket-disallows CCBot, Amazonbot, AMAZONAWS,
    awsbot, SemrushBot, SemrushBot-SA and rogerbot, which is the only machine-access
    posture Knight Frank publishes — and it is a refusal.

