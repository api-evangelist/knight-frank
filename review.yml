aid: knight-frank
name: Knight Frank
review:
  question: What is Knight Frank's real, publicly reachable API surface, what does a
    developer have to sign or join to use it, and what is its RESO posture?
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: brokerage
  primaryDomain: knightfrank.com
  summary: |
    Knight Frank publishes no developer programme of any kind — and simultaneously
    runs one API that answers anonymously, with a live Swagger UI and a valid
    OpenAPI 3.0.1 document, to anybody who finds the hostname. Those two facts are
    recorded separately here and neither should be read as implying the other.

    THE PUBLISHED POSTURE IS NOTHING. developer.knightfrank.com,
    developers.knightfrank.com, docs.knightfrank.com and apis.knightfrank.com do not
    resolve in DNS (no A record; curl exit 6, recorded as status 000). On
    knightfrank.com the paths /developers, /api, /docs, /openapi.json, /swagger.json,
    /api-docs, /.well-known/openid-configuration, /.well-known/security.txt,
    /.well-known/ai-plugin.json and /llms.txt all return 404. The 125 KB sitemap at
    https://www.knightfrank.com/sitemap.xml (HTTP 200, 610 <loc> entries) was grepped
    case-insensitively for "developer", "swagger", "openapi" and "graphql" — zero
    matches across the entire document. There is no developer portal, no API terms of
    use, no key issuance process, no sandbox, no rate-limit page, no status page, no
    changelog, no SDK and no Postman collection.

    THE HOMONYM TRAP. https://www.knightfrank.co.uk/developers returns HTTP 200 — but
    it 301s to
    https://www.knightfrank.co.uk/commercial/solutions/developers-housebuilders, a
    commercial advisory page for PROPERTY developers and housebuilders. This is a real
    estate homonym, not a developer portal, and it must not be scored as one.

    THE UNADVERTISED REACHABLE API. The consumer property search application at
    https://www.knightfrank.co.uk/properties/residential/for-sale/london (HTTP 200)
    carries an inline `kfsearchconfig` object naming its backing services:
    ApiBase https://api-v2.web.prd-knightfrank.com, ApiSecureBase
    https://api-v2.web.prd-knightfrank.com/secure, ApiBase3
    https://api-v3.web.prd-knightfrank.com, CmsBase https://www.knightfrank.com,
    ResourceHost https://content.knightfrank.com, plus an Azureb2c block. The two API
    hosts behave in opposite ways:

      - api-v3.web.prd-knightfrank.com is OPEN. /swagger/index.html returns HTTP 200
        with a working Swagger UI. /swagger/v1/swagger.json returns HTTP 200,
        application/json, 11,073 bytes, and parses as OpenAPI 3.0.1 titled
        "KnightFrank Api v3" with 11 operations. /swagger/v1/swagger.yaml also returns
        HTTP 200 (6,606 bytes) and parses. The endpoints themselves answer anonymously:
        GET /office?term=london&isoCode=GB&languageCode=en&maxResultCount=2 returned
        HTTP 200 with real office records (name, street address, postcode, country,
        switchboard number, office email); GET
        /person?term=smith&isoCode=GB&languageCode=en&maxResultCount=2 returned HTTP
        200 with real staff records (name, title, employee number, work email, direct
        dial, mobile, department, photo URL). No credential was presented and none was
        demanded — no 401, no 403, no API key header, and the OpenAPI document contains
        no securitySchemes block at all.

      - api-v2.web.prd-knightfrank.com is CLOSED. GET /properties/search returned HTTP
        401 and GET /secure/account returned HTTP 401. Its root 302s to
        /error.htm?aspxerrorpath=/, and /swagger/v1/swagger.json 302s to the same error
        page — no contract is served. The application bundle at
        /properties-resources/js/app-72bd2f22.bundle.js (HTTP 200, 1,057,443 bytes)
        shows this host being called through MSAL with a protected-resource map binding
        ApiSecureBase to the Azure AD B2C scope, for the paths /account,
        /properties/createsaved, /properties/savealerts and /properties/saved/.

    WHAT THIS MEANS FOR A DEVELOPER. Nothing is offered. The v3 surface is an internal
    corporate-search service that happens to be reachable and happens to ship its own
    contract; it is not a product, has no published terms, and could be firewalled
    without notice. The v2 surface — the one holding actual property listings and
    consumer account data — is genuinely gated and requires an Azure AD B2C consumer
    token minted for a first-party client. Neither route is a developer route.

    One OpenAPI document was harvested (openapi/) and two OpenID Connect discovery
    documents were harvested (authentication/). No OData $metadata, no AsyncAPI, no
    GraphQL schema, no JSON Schema and no Postman collection exists anywhere.

resoPosture:
  certified: false
  posture: No RESO reference found anywhere in Knight Frank's web estate; RESO is a
    North American NAR/MLS construct and the United Kingdom has no MLS to certify
    against.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  directoryEvidence: |
    https://www.reso.org/certificates/ — the official RESO Certification Status list —
    was fetched on 2026-07-26 (HTTP 200, 416,233 bytes) and searched
    case-insensitively for "knight", "knight frank" and "knightfrank". Zero matches
    anywhere in the document. The page was also searched for "United Kingdom" and
    "England" — zero matches; every listed organization is United States based.
    https://certification.reso.org/, the live certification analytics report, returned
    HTTP 400 to an anonymous client and could not be queried programmatically.
    https://www.reso.org/upi/ returned HTTP 404.
  odataEndpoint: none
  metadataDocument: |
    Probed https://api-v3.web.prd-knightfrank.com/$metadata (HTTP 404, zero bytes) and
    https://api-v2.web.prd-knightfrank.com/$metadata (HTTP 404, content-type
    application/json). No OData service document and no $metadata exists anywhere in
    the Knight Frank estate. The harvested contract is plain OpenAPI 3.0.1, not OData.
    Nothing OData-shaped was found to save verbatim.
  odataFalsePositive: |
    A case-insensitive grep of https://www.knightfrank.co.uk/ matched the string
    "odata". On inspection this is the substring of "nodata" inside an
    EPiServer/Optimizely Forms localization block ("nodata":"There is no data"). It is
    NOT an OData reference. Recorded explicitly so the false positive is not repeated.
  universalPropertyIdentifier: |
    No UPI. Knight Frank identifies people and offices with its own internal integer
    and employee-number identifiers (officeId and empNo values observed in live
    api-v3 responses) and identifies property through opaque slugs under
    /properties/. Nothing in the estate maps to a RESO Universal Property Identifier,
    and no UPI string appears in any fetched page or in the harvested OpenAPI document.
  marketNote: |
    This is the expected United Kingdom answer and is structural rather than a lapse.
    The UK has no MLS and therefore no cooperative standard to certify against.
    Residential listings are controlled by two portals — Rightmove and Zoopla — and
    reach them through agency CRM software (Reapit, Alto, Street, Apex27) rather than a
    shared cooperative pool. Knight Frank is a supplier into that pipe, not an operator
    of it. "Certified but not reachable" does not apply here: there is no certification
    layer in this market at all. Knight Frank does have a United States presence
    (knightfrank.us 301s to https://www.knightfrank.com/usa, HTTP 200) but it is a
    commercial and prime-residential advisory operation, not a residential MLS
    participant, so RESO certification is not a mechanism that applies to it either.

accessGate:
  gate: none-published
  gated: true
  selfServe: false
  portalConfirmed: false
  whatYouMustSignOrJoin: |
    Nothing is offered, so there is nothing to sign or join. There is no developer
    signup, no application form, no partner or data-licence programme page, no API
    terms of use, no sandbox and no key issuance process published anywhere on
    knightfrank.com, knightfrank.co.uk or any of the ~40 country domains linked from
    the global footer. The only published route into any Knight Frank data
    conversation is the corporate contact form at
    https://www.knightfrank.co.uk/contact-us (HTTP 200) or the office/people directory
    at https://www.knightfrank.com/people (HTTP 200). Any resulting arrangement would
    be a bespoke commercial conversation with no public terms, which is why the gate is
    recorded as none-published rather than partner-only — classifying it as
    partner-only would imply a partner programme exists, and none is published.
  whyGatedIsTrueDespiteAnAnonymousEndpoint: |
    This is the important nuance and it is the reason the two facts are recorded
    separately. `gated: true` describes what Knight Frank OFFERS a developer, which is
    nothing. It does not contradict the finding that
    api-v3.web.prd-knightfrank.com answers without credentials.

      - The data a real estate developer would actually want — property listings,
        saved searches, alerts, account state — lives on
        api-v2.web.prd-knightfrank.com and returns HTTP 401. It is protected by Azure
        AD B2C through a first-party MSAL client and a consumer sign-in policy. That is
        an end-user login for the "My Knight Frank" saved-property feature, not a
        developer credential, and there is no documented way for a third party to
        obtain a client registration in that tenant.
      - The surface that IS anonymous — api-v3 — is an internal corporate site-search
        service (CMS pages, research index, office directory, staff directory). It is
        unadvertised, undocumented in any human-facing place, carries no terms, and
        exists at a hostname (`web.prd-knightfrank.com`) that is plainly an internal
        environment naming convention rather than a product domain.

    A developer can call the v3 API today. A developer has not been invited to, cannot
    point at any published permission to, and has no stability or terms commitment.
  credentialIssuance: |
    For api-v3: none required and none issued — the API is anonymous.
    For api-v2: Azure AD B2C authorization-code flow via MSAL. The client id observed
    in the site configuration is a first-party Knight Frank web client bound to the
    scope MyKf.ReadWrite in the KnightFrankB2Cprod tenant. There is no application
    process, no developer console and no documented path for a third party to register
    a client against that tenant.
  docsAreOpen: |
    Partly, and by accident rather than by policy. The api-v3 OpenAPI document and its
    Swagger UI are fully open — anyone can read the contract. But that is one internal
    search service, not the listing estate. This is the inverse of the Zoopla shape
    (contracts public, data licensed): here the contract that is public belongs to the
    surface nobody wants, and the surface that matters publishes no contract at all.

openData:
  publishesOpenData: false
  note: |
    Knight Frank publishes no open, unlicensed, publicly callable dataset. The Knight
    Frank Research programme is substantial and well known — The Wealth Report, the
    Prime International Residential Index (PIRI 100), the Luxury Investment Index, the
    Wealth Sizing Model — and https://www.knightfrank.com/research returned HTTP 200,
    but it ships as PDF reports and web narrative with no data download, no CSV, no
    feed and no API. https://publications.knightfrank.com/ resolves but redirects to
    its own /404/ page. The Foleon-hosted publication microsite
    (knightfrank.foleon.com) and the Frontify-hosted assets.knightfrank.com are
    brand/document delivery, not data.

    The anonymously reachable api-v3 /intelligencelab operations index that research
    output for site search, but that is a search index over marketing content behind an
    unadvertised internal endpoint — it is not published open data and must not be
    counted as such.

    The genuinely open UK property layer sits in the public sector and is not operated
    by Knight Frank: HM Land Registry Price Paid Data and ownership data under the Open
    Government Licence, and Ordnance Survey's addressing and mapping open products.
    This is the structural inverse of the United States — the UK has no industry
    standard and no MLS, but it does have real open government property APIs, and none
    of them come from the brokerages or the portals.

authModel:
  schemes:
  - surface: api-v3.web.prd-knightfrank.com
    scheme: none
    detail: >-
      No authentication. The harvested OpenAPI 3.0.1 document contains no
      `components.securitySchemes` and no `security` array. Live GETs against /office,
      /person, /person/autocomplete and /service-lines returned HTTP 200 with no
      credential; /search returned HTTP 204 and /intelligencelab/facets returned HTTP
      500, neither of which is an auth challenge.
  - surface: api-v2.web.prd-knightfrank.com
    scheme: OAuth 2.0 / OpenID Connect via Azure AD B2C (bearer token, MSAL)
    detail: >-
      GET /properties/search and GET /secure/account both returned HTTP 401 with a
      zero-byte body. The front-end application binds this host to a B2C scope through
      an MSAL protected-resource map.
  azureAdB2C:
    customDomain: login.prd-knightfrank.com
    b2cloginDomain: knightfrankb2cprod.b2clogin.com
    tenantDomain: KnightFrankB2Cprod.onmicrosoft.com
    tenantId: ea15e386-0dbc-4a5b-ac74-08f50f444486
    userFlowOrCustomPolicy: B2C_1A_MYKFSIGNIN
    scope: >-
      https://KnightFrankB2Cprod.onmicrosoft.com/6e6a9034-3e20-4ec6-993f-61c89c0a2e2a/MyKf.ReadWrite
    sourceOfConfig: >-
      Inline `kfsearchconfig.Azureb2c` object in the HTML of
      https://www.knightfrank.co.uk/properties/residential/for-sale/london (HTTP 200).
      These are public client-side values, not secrets.
    note: >-
      This is a CONSUMER identity system for the "My Knight Frank" saved-property and
      alerts feature. It is not a developer identity system. `scopes_supported` in both
      discovery documents is `["openid"]` only — the MyKf.ReadWrite resource scope is
      not advertised in discovery, it is hard-coded in the first-party client.
  oidcDiscoveryHarvested:
  - url: >-
      https://login.prd-knightfrank.com/ea15e386-0dbc-4a5b-ac74-08f50f444486/B2C_1A_MYKFSIGNIN/v2.0/.well-known/openid-configuration
    status: 200
    contentType: application/json; charset=utf-8
    savedAs: authentication/knight-frank-b2c-mykfsignin-openid-configuration.json
    parses: true
  - url: >-
      https://KnightFrankB2Cprod.b2clogin.com/KnightFrankB2Cprod.onmicrosoft.com/B2C_1A_MYKFSIGNIN/v2.0/.well-known/openid-configuration
    status: 200
    contentType: application/json; charset=utf-8
    savedAs: authentication/knight-frank-b2clogin-mykfsignin-openid-configuration.json
    parses: true
  oidcDiscoveryFacts:
    responseTypesSupported: [code, code id_token, code token, code id_token token,
      id_token, id_token token, token, token id_token]
    scopesSupported: [openid]
    idTokenSigningAlg: [RS256]
    tokenEndpointAuthMethods: [client_secret_post, client_secret_basic]
    subjectTypes: [pairwise]
    claimsSupported: [extension_HubContactId, oid, sub, tid, iss, iat, exp, aud, acr,
      nonce, auth_time]
    note: >-
      The custom claim `extension_HubContactId` links a B2C consumer account to a
      contact record in an internal Knight Frank "Hub" CRM.
  noSecurityTxt: >-
    https://www.knightfrank.com/.well-known/security.txt and
    https://www.knightfrank.co.uk/.well-known/security.txt both returned HTTP 404. No
    vulnerability disclosure channel is published.

